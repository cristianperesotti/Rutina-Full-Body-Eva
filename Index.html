<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Rutina Full Body- Eva</title>
<style>
:root{
  --bordo:#7a1f3d;
  --bordo-osc:#4f1226;
  --bordo-cl:#a3395b;
  --beige:#efe4d3;
  --beige-osc:#d9c8ad;
  --blanco:#ffffff;
  --negro:#1b1416;
  --gris:#6b5f62;
  --ok:#2e6b3f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--beige);color:var(--negro);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;padding-bottom:40px}
header{background:linear-gradient(135deg,var(--bordo-osc),var(--bordo));color:var(--blanco);padding:22px 16px 18px;border-bottom:4px solid var(--negro)}
header h1{margin:0;font-size:22px;letter-spacing:.5px}
header p{margin:4px 0 0;color:var(--beige);font-size:13px}
nav{position:sticky;top:0;z-index:10;background:var(--negro);display:flex;overflow-x:auto;gap:0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;background:none;border:0;color:var(--beige-osc);padding:13px 16px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--blanco);border-bottom-color:var(--bordo-cl);background:#2a1d21}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--blanco);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 0 var(--beige-osc),0 4px 12px rgba(79,18,38,.08);border-left:5px solid var(--bordo)}
.card.done{border-left-color:var(--ok)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
label.small,.small{font-size:12px;color:var(--gris)}
input,select{font:inherit;color:var(--negro)}
input[type=number],input[type=date],select{background:var(--beige);border:1.5px solid var(--beige-osc);border-radius:10px;padding:9px 10px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--bordo);background:#fff}
input:disabled{opacity:.4}
.datebar{display:grid;grid-template-columns:1fr;gap:10px}
.bar{height:10px;background:var(--beige-osc);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bordo),var(--bordo-cl));transition:width .25s}
.ex h3{margin:0;font-size:16px;color:var(--bordo-osc)}
.badge{background:var(--bordo);color:var(--blanco);font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.hint{font-size:12px;color:var(--gris);margin:6px 0 0}
.wrow{display:grid;grid-template-columns:1fr auto;gap:10px;margin:12px 0 10px;align-items:end}
.bwbtn{background:var(--blanco);color:var(--bordo);border:1.5px solid var(--bordo);border-radius:10px;padding:10px 12px;font-weight:600;font-size:13px;cursor:pointer}
.bwbtn.on{background:var(--bordo);color:var(--blanco)}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px}
.sets div span{display:block;font-size:11px;color:var(--gris);margin-bottom:3px;text-align:center}
.sets input{text-align:center;padding:10px 4px}
.sets input.filled{border-color:var(--bordo);background:#f7e9ee;font-weight:700}
.btn{background:var(--bordo);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;font-size:14px}
.btn.alt{background:var(--negro)}
.btn.ghost{background:transparent;color:var(--bordo);border:1.5px solid var(--bordo)}
h2{margin:6px 0 10px;font-size:18px;color:var(--bordo-osc)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--blanco);border-radius:12px;padding:12px;border-top:4px solid var(--bordo)}
.stat b{display:block;font-size:20px;color:var(--bordo-osc)}
.stat span{font-size:12px;color:var(--gris)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--blanco);border:1.5px solid var(--beige-osc);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--negro)}
.chip.on{background:var(--negro);border-color:var(--negro);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bordo-osc);color:#fff;text-align:left;padding:8px;font-weight:600}
td{padding:8px;border-bottom:1px solid var(--beige-osc)}
.up{color:var(--ok);font-weight:700}.down{color:var(--bordo);font-weight:700}
.empty{padding:22px;text-align:center;color:var(--gris);font-size:14px}
svg{width:100%;height:auto;display:block}
.grid{stroke:var(--beige-osc);stroke-width:1}
.axis{fill:var(--gris);font-size:11px}
.line{fill:none;stroke:var(--bordo);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.dot{fill:var(--blanco);stroke:var(--bordo);stroke-width:2.5}
.val{fill:var(--negro);font-size:11px;font-weight:700;text-anchor:middle}
.del{background:none;border:0;color:var(--bordo);font-size:18px;cursor:pointer}
footer{max-width:760px;margin:10px auto 0;padding:0 14px;text-align:center}
footer .small{margin:6px 0}
footer button{background:none;border:0;color:var(--bordo);text-decoration:underline;font-size:12px;cursor:pointer;padding:4px 8px}
@media(min-width:560px){.datebar{grid-template-columns:200px 1fr;align-items:end}}
</style>
</head>
<body>
<header>
  <h1>🏋️ Mi Rutina Full Body - Eva Martinelli</h1>
  <p>3 días · seguimiento de pesos, repeticiones y progreso</p>
</header>
<nav id="tabs">
  <button data-tab="d1">Día 1</button>
  <button data-tab="d2">Día 2</button>
  <button data-tab="d3">Día 3</button>
  <button data-tab="prog">Progreso</button>
  <button data-tab="peso">Mi peso</button>
</nav>
<main id="view"></main>
<footer>
  <p class="small">Los datos se guardan en este navegador. Hacé un respaldo de vez en cuando.</p>
  <button id="exp">Exportar respaldo</button>
  <button id="imp">Importar respaldo</button>
  <input type="file" id="file" accept="application/json" hidden>
</footer>

<script>
/* ===== Rutina (de la planilla) =====  [nombre, series, repeticiones, unidad] */
const PLAN = {
  d1:{name:"Día 1", ex:[
    ["Sentadilla en Smith",4,"10",""],
    ["Elevación de cadera en máquina",4,"10-12",""],
    ["Isquios en camilla",3,"12",""],
    ["Dorsal al pecho amplio",4,"10-12",""],
    ["Press plano con mancuernas",3,"10-12",""],
    ["Vuelo lateral con mancuernas",3,"12-15",""],
    ["Curl bíceps barra",3,"12",""],
    ["Tríceps en polea con soga",3,"12-15",""],
    ["Abdominales cortos",3,"15",""]
  ]},
  d2:{name:"Día 2", ex:[
    ["Hack",4,"12",""],
    ["Búlgaras con mancuernas",3,"10","C/P"],
    ["Peso muerto con mancuernas",4,"10",""],
    ["Remo bajo neutro",4,"10-12",""],
    ["Press inclinado con mancuernas",3,"10-12",""],
    ["Press militar con mancuernas",3,"10-12",""],
    ["Martillo con mancuernas",3,"12",""],
    ["Fondos en banco",3,"12",""],
    ["Plancha",3,"30","seg"]
  ]},
  d3:{name:"Día 3", ex:[
    ["Camilla de cuádriceps",4,"12-15",""],
    ["Patada de glúteo",3,"12","C/P"],
    ["Isquio de pie en máquina",3,"12","C/P"],
    ["Dorsal alto máquina supino",4,"10-12",""],
    ["Press hammer",3,"12-15",""],
    ["Posterior en banco con mancuernas",3,"15",""],
    ["Curl uni polea",3,"12","C/B"],
    ["Patada de burro en polea",3,"12","C/B"],
    ["Bicho muerto",3,"12",""]
  ]}
};
const DAYS = ["d1","d2","d3"];

/* ===== Estado y almacenamiento ===== */
const KEY = "rutina-progreso-v1";
let DB = {sessions:{}, body:{}};
try{ const raw = localStorage.getItem(KEY); if(raw) DB = Object.assign(DB, JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }

const pad = n => String(n).padStart(2,"0");
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function fmt(s){ const p=s.split("-"); return p[2]+"/"+p[1]; }
function fmtFull(s){ const p=s.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
const exId = (day,i)=>day+"-"+i;
const num = v => { const n=parseFloat(String(v).replace(",",".")); return isNaN(n)?0:n; };

let tab = "d1";
let curDate = todayStr();
let progSel = "all";
let progMetric = "w";

/* ===== Datos de sesiones ===== */
function getEntry(date,day,id){ return (DB.sessions[date]&&DB.sessions[date][day]&&DB.sessions[date][day][id])||null; }
function ensureEntry(date,day,id){
  DB.sessions[date] = DB.sessions[date]||{};
  DB.sessions[date][day] = DB.sessions[date][day]||{};
  return DB.sessions[date][day][id] = DB.sessions[date][day][id]||{bw:false,w:"",r:[]};
}
function cleanup(date,day,id){
  const e=getEntry(date,day,id); if(!e) return;
  if(!e.bw && e.w==="" && e.r.every(x=>!x)){
    delete DB.sessions[date][day][id];
    if(!Object.keys(DB.sessions[date][day]).length) delete DB.sessions[date][day];
    if(!Object.keys(DB.sessions[date]).length) delete DB.sessions[date];
  }
}
function entryStats(e){
  const reps=e.r.map(num);
  const totalReps=reps.reduce((a,b)=>a+b,0);
  const w=e.bw?0:num(e.w);
  return {w, bw:e.bw, reps, totalReps, vol:w*totalReps, sets:reps.filter(x=>x>0).length};
}
function history(day,id){
  const out=[];
  Object.keys(DB.sessions).sort().forEach(date=>{
    const e=getEntry(date,day,id);
    if(e){ const s=entryStats(e); if(s.totalReps>0||s.w>0) out.push(Object.assign({date},s)); }
  });
  return out;
}
function previousFor(day,id,date){
  const h=history(day,id).filter(x=>x.date<date);
  return h.length?h[h.length-1]:null;
}
function plannedSets(day){ return PLAN[day].ex.reduce((a,x)=>a+x[1],0); }
function doneSets(date,day){
  let n=0; PLAN[day].ex.forEach((_,i)=>{ const e=getEntry(date,day,exId(day,i)); if(e) n+=e.r.filter(x=>num(x)>0).length; });
  return n;
}

/* ===== Gráfico de línea (SVG) ===== */
function lineChart(pts,unit){
  if(!pts.length) return '<div class="empty">Todavía no hay datos para graficar.</div>';
  const W=600,H=250,L=46,R=18,T=22,B=34;
  const ys=pts.map(p=>p.y);
  let min=Math.min(...ys), max=Math.max(...ys);
  if(min===max){ min-=1; max+=1; }
  const pd=(max-min)*0.18; min=Math.max(0,min-pd); max=max+pd;
  const X=i=> pts.length===1 ? (L+(W-L-R)/2) : L+i*(W-L-R)/(pts.length-1);
  const Y=v=> T+(1-(v-min)/(max-min))*(H-T-B);
  let g="";
  for(let k=0;k<=4;k++){
    const v=min+(max-min)*k/4, y=Y(v);
    g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="axis" x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(v*10)/10}</text>`;
  }
  const step=Math.ceil(pts.length/7);
  let xl="";
  pts.forEach((p,i)=>{ if(i%step===0||i===pts.length-1) xl+=`<text class="axis" x="${X(i)}" y="${H-10}" text-anchor="middle">${fmt(p.x)}</text>`; });
  const path=pts.map((p,i)=>(i?"L":"M")+X(i)+" "+Y(p.y)).join(" ");
  let dots=""; const showVals=pts.length<=12;
  pts.forEach((p,i)=>{ dots+=`<circle class="dot" cx="${X(i)}" cy="${Y(p.y)}" r="5"/>`; if(showVals) dots+=`<text class="val" x="${X(i)}" y="${Y(p.y)-11}">${Math.round(p.y*10)/10}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${xl}<path class="line" d="${path}"/>${dots}</svg>${unit?`<div class="small" style="text-align:center">${unit}</div>`:""}`;
}

/* ===== Vistas ===== */
const view=document.getElementById("view");

function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  if(DAYS.includes(tab)) renderDay(tab);
  else if(tab==="prog") renderProg();
  else renderPeso();
  window.scrollTo({top:0});
}

/* --- Día --- */
function renderDay(day){
  const plan=PLAN[day];
  let h=`<div class="card"><div class="datebar">
    <div><label class="small">Fecha de la sesión</label><input type="date" id="sdate" value="${curDate}"></div>
    <div><div class="row between"><b id="barTxt"></b><span class="small">series completadas</span></div><div class="bar"><i id="barFill"></i></div></div>
  </div></div>`;
  plan.ex.forEach((x,i)=>{
    const id=exId(day,i), e=getEntry(curDate,day,id)||{bw:false,w:"",r:[]};
    const prev=previousFor(day,id,curDate);
    let hint="Primera vez: ¡registrá tus números!";
    if(prev){
      const p=(prev.bw?"Peso corporal":prev.w+" kg")+" · "+prev.reps.filter(r=>r>0).join(" / ")+(x[3]==="seg"?" seg":" reps");
      hint=`Anterior (${fmt(prev.date)}): ${p}`;
    }
    const goal=x[1]+" × "+x[2]+(x[3]?" "+x[3]:"");
    const target=parseInt(String(x[2]).split("-").pop());
    let sets="";
    for(let s=0;s<x[1];s++){
      const v=e.r[s]||"";
      sets+=`<div><span>Serie ${s+1}</span><input class="r${v?" filled":""}" type="number" inputmode="numeric" min="0" data-i="${s}" value="${v}" placeholder="${target}"></div>`;
    }
    h+=`<div class="card ex" data-day="${day}" data-id="${id}" data-n="${x[1]}">
      <div class="row between"><h3>${i+1}. ${x[0]}</h3><span class="badge">${goal}</span></div>
      <p class="hint">${hint}</p>
      <div class="wrow">
        <div><label class="small">Peso utilizado (kg)</label><input class="w" type="number" inputmode="decimal" step="0.5" min="0" value="${e.w}" placeholder="kg" ${e.bw?"disabled":""}></div>
        <button class="bwbtn${e.bw?" on":""}" type="button">${e.bw?"✓ ":""}Peso corporal</button>
      </div>
      <div class="sets">${sets}</div>
    </div>`;
  });
  view.innerHTML=h;
  updateBar(day);
  plan.ex.forEach((_,i)=>updateCardState(day,i));
}
function updateBar(day){
  const t=plannedSets(day), d=doneSets(curDate,day);
  const bt=document.getElementById("barTxt"), bf=document.getElementById("barFill");
  if(bt){ bt.textContent=d+" / "+t; bf.style.width=(t?d/t*100:0)+"%"; }
}
function updateCardState(day,i){
  const card=view.querySelector(`.ex[data-id="${exId(day,i)}"]`); if(!card) return;
  const e=getEntry(curDate,day,exId(day,i));
  const n=+card.dataset.n, done=e&&e.r.filter(x=>num(x)>0).length>=n;
  card.classList.toggle("done",!!done);
}

view.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="sdate"){ if(t.value){ curDate=t.value; render(); } return; }
  const card=t.closest(".ex"); if(!card) return;
  const day=card.dataset.day,id=card.dataset.id;
  const e=ensureEntry(curDate,day,id);
  if(t.classList.contains("w")) e.w=t.value;
  if(t.classList.contains("r")){ e.r[+t.dataset.i]=t.value; t.classList.toggle("filled",!!t.value); }
  cleanup(curDate,day,id); save();
  updateBar(day); updateCardState(day,+id.split("-")[1]);
});
view.addEventListener("click",ev=>{
  const b=ev.target.closest(".bwbtn");
  if(b){
    const card=b.closest(".ex"), day=card.dataset.day,id=card.dataset.id;
    const e=ensureEntry(curDate,day,id);
    e.bw=!e.bw; if(e.bw) e.w="";
    cleanup(curDate,day,id); save();
    b.classList.toggle("on",e.bw); b.textContent=(e.bw?"✓ ":"")+"Peso corporal";
    const wi=card.querySelector(".w"); wi.disabled=e.bw; if(e.bw) wi.value="";
    return;
  }
  const c=ev.target.closest(".chip");
  if(c&&c.dataset.m){ progMetric=c.dataset.m; renderProg(); }
  const del=ev.target.closest(".del");
  if(del){ if(confirm("¿Borrar este registro de peso?")){ delete DB.body[del.dataset.d]; save(); renderPeso(); } }
});

/* --- Progreso --- */
function metricVal(s,m){ return m==="w"?s.w : m==="r"?s.totalReps : s.vol; }
const metricName={w:"Peso (kg)",r:"Repeticiones totales",vol:"Volumen (kg × reps)",pct:"% de series completadas"};

function renderProg(){
  let opts=`<option value="all"${progSel==="all"?" selected":""}>📊 General (todos los ejercicios)</option>`;
  DAYS.forEach(d=>{
    opts+=`<optgroup label="${PLAN[d].name}">`;
    PLAN[d].ex.forEach((x,i)=>{ const v=d+"|"+i; opts+=`<option value="${v}"${progSel===v?" selected":""}>${x[0]}</option>`; });
    opts+="</optgroup>";
  });
  let h=`<h2>Progreso</h2><div class="card"><label class="small">Ver progreso de</label><select id="psel">${opts}</select></div>`;
  h+= progSel==="all" ? progGeneral() : progExercise();
  view.innerHTML=h;
  document.getElementById("psel").addEventListener("change",e=>{ progSel=e.target.value; if(progSel==="all"&&progMetric==="w")progMetric="vol"; renderProg(); });
}
function chips(list){
  return `<div class="chips">`+list.map(([m,l])=>`<button class="chip${progMetric===m?" on":""}" data-m="${m}">${l}</button>`).join("")+`</div>`;
}
function delta(a,b){
  if(a==null||b==null) return "";
  const d=Math.round((b-a)*10)/10;
  if(d===0) return '<span class="small">=</span>';
  return d>0?`<span class="up">▲ ${d}</span>`:`<span class="down">▼ ${Math.abs(d)}</span>`;
}

function progExercise(){
  const [day,i]=progSel.split("|"); const id=exId(day,i), x=PLAN[day].ex[i];
  const hist=history(day,id);
  if(progMetric==="pct") progMetric="w";
  const anyWeight=hist.some(s=>s.w>0);
  if(!anyWeight && progMetric==="w") progMetric="r";
  let h=`<div class="card"><b>${x[0]}</b> <span class="small">· Objetivo ${x[1]} × ${x[2]}${x[3]?" "+x[3]:""}</span>`;
  if(!hist.length) return h+`<div class="empty">Aún no registraste este ejercicio.</div></div>`;
  const first=hist[0], last=hist[hist.length-1];
  const best=hist.reduce((a,s)=>metricVal(s,progMetric)>metricVal(a,progMetric)?s:a,hist[0]);
  h+=`<div class="chips" style="margin-bottom:0"></div>`+chips([["w","Peso"],["r","Repeticiones"],["vol","Volumen"]])+
     lineChart(hist.map(s=>({x:s.date,y:metricVal(s,progMetric)})),metricName[progMetric])+`</div>`;
  const mv=s=>metricVal(s,progMetric);
  h+=`<div class="stats">
    <div class="stat"><b>${mv(first)}</b><span>Primera sesión (${fmt(first.date)})</span></div>
    <div class="stat"><b>${mv(last)}</b><span>Última sesión (${fmt(last.date)})</span></div>
    <div class="stat"><b>${mv(best)}</b><span>Mejor marca (${fmt(best.date)})</span></div>
    <div class="stat"><b>${Math.round((mv(last)-mv(first))*10)/10}</b><span>Cambio total (primera → última)</span></div>
  </div>`;
  h+=`<div class="card" style="padding:0;overflow:hidden"><table><tr><th>Fecha</th><th>Peso</th><th>Reps</th><th>Volumen</th><th>Cambio</th></tr>`;
  hist.slice().reverse().forEach((s,k,arr)=>{
    const prev=arr[k+1];
    h+=`<tr><td>${fmt(s.date)}</td><td>${s.bw?"Corporal":s.w+" kg"}</td><td>${s.reps.filter(r=>r>0).join("/")}</td><td>${s.vol}</td><td>${prev?delta(mv(prev),mv(s)):""}</td></tr>`;
  });
  return h+`</table></div>`;
}

function progGeneral(){
  const dates=Object.keys(DB.sessions).sort();
  const rows=[];
  dates.forEach(date=>{
    let vol=0,reps=0,done=0,planned=0,days=[];
    DAYS.forEach(d=>{
      const dayObj=DB.sessions[date][d]; if(!dayObj) return;
      let any=false;
      PLAN[d].ex.forEach((_,i)=>{ const e=dayObj[exId(d,i)]; if(e){ const s=entryStats(e); vol+=s.vol; reps+=s.totalReps; done+=s.sets; if(s.sets) any=true; } });
      if(any){ days.push(d.replace("d","Día ")); planned+=plannedSets(d); }
    });
    if(days.length) rows.push({date,vol,reps,pct:planned?Math.round(done/planned*100):0,days:days.join(", "),done,planned});
  });
  if(!["vol","r","pct"].includes(progMetric)) progMetric="vol";
  if(!rows.length) return `<div class="card"><div class="empty">Cuando registres tus primeras sesiones vas a ver acá tu progreso general.</div></div>`;
  const key={vol:"vol",r:"reps",pct:"pct"}[progMetric];
  const last=rows[rows.length-1], first=rows[0];
  let h=`<div class="stats">
    <div class="stat"><b>${rows.length}</b><span>Sesiones registradas</span></div>
    <div class="stat"><b>${Math.round(rows.reduce((a,r)=>a+r.pct,0)/rows.length)}%</b><span>Cumplimiento promedio</span></div>
    <div class="stat"><b>${last.vol}</b><span>Volumen última sesión (kg)</span></div>
    <div class="stat"><b>${rows.length>1?Math.round((last.vol-first.vol)*10)/10:0}</b><span>Cambio de volumen vs. primera</span></div>
  </div>
  <div class="card">${chips([["vol","Volumen"],["r","Repeticiones"],["pct","Cumplimiento %"]])}${lineChart(rows.map(r=>({x:r.date,y:r[key]})),metricName[progMetric])}</div>`;
  h+=`<div class="card" style="padding:0;overflow:hidden"><table><tr><th>Fecha</th><th>Día</th><th>Series</th><th>Volumen</th><th>Cambio</th></tr>`;
  rows.slice().reverse().forEach((r,k,arr)=>{
    const prev=arr[k+1];
    h+=`<tr><td>${fmt(r.date)}</td><td>${r.days}</td><td>${r.done}/${r.planned}</td><td>${r.vol}</td><td>${prev?delta(prev[key],r[key]):""}</td></tr>`;
  });
  return h+`</table></div>
  <p class="small">Volumen = peso × repeticiones, sumado. Los ejercicios con peso corporal suman repeticiones pero no volumen en kg.</p>`;
}

/* --- Peso corporal --- */
function renderPeso(){
  const dates=Object.keys(DB.body).sort();
  const pts=dates.map(d=>({x:d,y:DB.body[d]}));
  let h=`<h2>Mi peso</h2><div class="card"><div class="row" style="align-items:end">
    <div style="flex:1;min-width:130px"><label class="small">Fecha</label><input type="date" id="bdate" value="${todayStr()}"></div>
    <div style="flex:1;min-width:110px"><label class="small">Peso (kg)</label><input type="number" id="bkg" inputmode="decimal" step="0.1" min="0" placeholder="Ej: 72.4" value="${DB.body[todayStr()]??""}"></div>
    <button class="btn" id="bsave">Guardar</button></div></div>`;
  if(pts.length){
    const cur=pts[pts.length-1].y, ini=pts[0].y;
    const l7=pts.slice(-7), avg=l7.reduce((a,p)=>a+p.y,0)/l7.length;
    const diff=Math.round((cur-ini)*10)/10;
    h+=`<div class="stats">
      <div class="stat"><b>${cur} kg</b><span>Último registro (${fmt(pts[pts.length-1].x)})</span></div>
      <div class="stat"><b>${Math.round(avg*10)/10} kg</b><span>Promedio últimos ${l7.length} registros</span></div>
      <div class="stat"><b>${ini} kg</b><span>Primer registro (${fmt(pts[0].x)})</span></div>
      <div class="stat"><b>${diff>0?"+":""}${diff} kg</b><span>Cambio total</span></div></div>`;
  }
  h+=`<div class="card">${lineChart(pts,"Peso corporal (kg)")}</div>`;
  if(pts.length){
    h+=`<div class="card" style="padding:0;overflow:hidden"><table><tr><th>Fecha</th><th>Peso</th><th>Cambio</th><th></th></tr>`;
    pts.slice().reverse().forEach((p,k,arr)=>{
      const prev=arr[k+1];
      h+=`<tr><td>${fmtFull(p.x)}</td><td>${p.y} kg</td><td>${prev?delta(prev.y,p.y):""}</td><td><button class="del" data-d="${p.x}" aria-label="Borrar">🗑</button></td></tr>`;
    });
    h+=`</table></div>`;
  }
  view.innerHTML=h;
  const bd=document.getElementById("bdate"),bk=document.getElementById("bkg");
  bd.addEventListener("change",()=>{ bk.value=DB.body[bd.value]??""; });
  document.getElementById("bsave").addEventListener("click",()=>{
    const v=num(bk.value);
    if(!bd.value||v<=0){ alert("Ingresá una fecha y un peso válido."); return; }
    DB.body[bd.value]=Math.round(v*10)/10; save(); renderPeso();
  });
}

/* ===== Navegación y respaldo ===== */
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  tab=b.dataset.tab; render();
});
document.getElementById("exp").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(DB)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="respaldo-rutina-"+todayStr()+".json"; a.click();
});
document.getElementById("imp").addEventListener("click",()=>document.getElementById("file").click());
document.getElementById("file").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result);
    if(!d.sessions||!d.body) throw 0;
    if(confirm("Esto reemplaza los datos actuales por los del respaldo. ¿Continuar?")){ DB=d; save(); render(); }
  }catch(_){ alert("El archivo no es un respaldo válido."); } };
  r.readAsText(f); e.target.value="";
});

render();
</script>
</body>
</html>
